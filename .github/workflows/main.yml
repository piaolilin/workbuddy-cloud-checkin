name: WorkBuddy Daily Checkin

on:
  schedule:
    - cron: '0 1 * * *' # 每天北京时间早上 9:00 自动运行
  workflow_dispatch: # 允许手动点击运行

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Checkin Script
        env:
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
        # 假设入口文件是 index.js，如果是别的请留意
        run: node index.js
