name: WorkBuddy Daily Checkin

on:
  schedule:
    - cron: '0 22 * * *' # 每天 UTC 22:00（北京时间早上 6:00）
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkin via CodeBuddy API
        env:
          WORKBUDDY_COOKIE: ${{ secrets.WORKBUDDY_COOKIE }}
        run: |
          echo "=== 1. 查询今日签到状态 ==="
          curl -m 15 -s -w "\n[状态查询 HTTP 状态码: %{http_code}]\n" \
            -X POST "https://www.codebuddy.cn/v2/billing/meter/checkin-activity-status" \
            -H "Cookie: $WORKBUDDY_COOKIE" \
            -H "Content-Type: application/json" \
            -d '{}'

          echo "=== 2. 执行签到 ==="
          curl -m 15 -s -w "\n[签到请求 HTTP 状态码: %{http_code}]\n" \
            -X POST "https://www.codebuddy.cn/v2/billing/meter/daily-checkin" \
            -H "Cookie: $WORKBUDDY_COOKIE" \
            -H "Content-Type: application/json" \
            -d '{}'
