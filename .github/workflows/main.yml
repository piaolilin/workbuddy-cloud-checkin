name: WorkBuddy Daily Checkin

on:
  schedule:
    - cron: '0 1 * * *' # 每天北京时间早上 9:00 自动运行
  workflow_dispatch: # 允许手动点击运行

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Grant execute permission for scripts
        run: chmod +x scripts/*.sh

      - name: Run Checkin Script
        env:
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          # 加上下面这一行，把你的账号和仓库名写进去
          WB_REPO: "piaolilin/workbuddy-cloud-checkin" 
        run: bash scripts/cloud-run-checkin.sh
